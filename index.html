<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>සිසුන් ඇතුලත් කිරීමේ පෝරමය</title>
  <style>
    /* වර්ණ කිහිපයක් අතර බිලින්ක් වන Animation එක */
    @keyframes multiColorBg {
      0%   { background-color: #004080; }
      25%  { background-color: #ff8080; }
      50%  { background-color: #4b0082; }
      75%  { background-color: #008080; }
      100% { background-color: #004080; }
    }

    body {
      font-family: Arial, sans-serif;
      animation: multiColorBg 10s infinite linear;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    #feedback {
      margin-top: 15px;
      padding: 15px;
      border-radius: 6px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .wa-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .wa-btn:hover {
      background-color: #1eb854;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>සිසුන් ඇතුලත් කිරීමේ පෝරමය</h2>
  <form id="studentForm">
    <div class="form-group">
      <label>ශිෂ්‍යයාගේ නම:</label>
      <input type="text" id="studentName" name="studentName" required>
    </div>
    
    <div class="form-group">
      <label>භාරකරුගේ නම:</label>
      <input type="text" name="guardianName" required>
    </div>
    
    <div class="form-group">
      <label>ලිපිනය:</label>
      <textarea name="address" rows="3" required></textarea>
    </div>
    
    <div class="form-group">
      <label>පාසල:</label>
      <input type="text" name="school" required>
    </div>
    
    <div class="form-group">
      <label>වට්ස්ඇප් දුරකථන අංකය:</label>
      <input type="tel" id="whatsapp" name="whatsapp" placeholder="07X XXXXXXX" required>
    </div>
    
    <button type="submit" id="submitBtn">ඇතුලත් කරන්න</button>
  </form>

  <div id="feedback"></div>
</div>

<script>
  // ඔබගේ Google Apps Script Web App URL එක පහත යොදන්න
  const scriptURL = 'https://script.google.com/macros/s/AKfycbygdJ5lNRfsDE2ZD7ox_1FC6U0UMoRFqpaYcYPyfHGurnUcG45lHTqQjSpintLK4hbjiw/exec';
  
  const form = document.forms['studentForm'];
  const feedback = document.getElementById('feedback');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = 'යවමින් පවතී...';

    const studentName = document.getElementById('studentName').value;
    let phoneNum = document.getElementById('whatsapp').value.trim();

    // දුරකථන අංකය ජාත්‍යන්තර ආකෘතියට සකස් කිරීම
    if(phoneNum.startsWith('0')) {
      phoneNum = '94' + phoneNum.substring(1);
    }

    // Google Sheet එකට දත්ත යැවීම
    fetch(scriptURL, { 
      method: 'POST', 
      mode: 'no-cors',
      body: new FormData(form)
    })
    .then(() => {
      // WhatsApp පණිවිඩය සූදානම් කිරීම
      const message = `ආයුබෝවන් ${studentName},\nඔබගේ තොරතුරු සාර්ථකව පද්ධතියට ඇතුලත් විය.\nස්තූතියි!`;
      const whatsappURL = `https://api.whatsapp.com/send?phone=${phoneNum}&text=${encodeURIComponent(message)}`;

      // Feedback පණිවිඩය සහ WhatsApp Link එක පෙන්වීම
      feedback.className = 'success';
      feedback.innerHTML = `
        ඔබගේ තොරතුරු සාර්ථකව ඇතුලත් කරන ලදී!<br><br>
        <a href="${whatsappURL}" target="_blank" class="wa-btn">
           WhatsApp පණිවිඩය යවන්න
        </a>
      `;
      feedback.style.display = 'block';

      // ස්වයංක්‍රීයව WhatsApp Open කිරීමට උත්සාහ කිරීම
      window.open(whatsappURL, '_blank');

      form.reset();
      submitBtn.disabled = false;
      submitBtn.innerText = 'ඇතුලත් කරන්න';
    })
    .catch(error => {
      console.error('Error!', error.message);
      feedback.className = 'error';
      feedback.innerText = 'තොරතුරු යැවීමේදී දෝෂයක් සිදු විය.';
      feedback.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerText = 'ඇතුලත් කරන්න';
    });
  });
</script>

</body>
</html>
