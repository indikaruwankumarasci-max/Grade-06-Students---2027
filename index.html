<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>සිසුන් ඇතුලත් කිරීමේ පෝරමය</title>
  <style>
    /* නිල් පැහැයේ සිට ලා රතු පැහැයට ස්වයංක්‍රීයව වෙනස් වන Animation එක */
    @keyframes bgChange {
      0% { background-color: #004080; }
      50% { background-color: #ff9999; }
      100% { background-color: #004080; }
    }

    body {
      font-family: Arial, sans-serif;
      animation: bgChange 6s infinite alternate;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
    }

    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #444;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }

    /* Feedback පණිවිඩය සඳහා Styling */
    #feedback {
      margin-top: 15px;
      padding: 10px;
      border-radius: 5px;
      display: none;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>සිසුන් ඇතුලත් කිරීමේ පෝරමය</h2>
  <form id="studentForm">
    <div class="form-group">
      <label>ශිෂ්‍යයාගේ නම:</label>
      <input type="text" name="studentName" required>
    </div>
    
    <div class="form-group">
      <label>භාරකරුගේ නම:</label>
      <input type="text" name="guardianName" required>
    </div>
    
    <div class="form-group">
      <label>ලිපිනය:</label>
      <textarea name="address" rows="3" required></textarea>
    </div>
    
    <div class="form-group">
      <label>පාසල:</label>
      <input type="text" name="school" required>
    </div>
    
    <div class="form-group">
      <label>වට්ස්ඇප් දුරකථන අංකය:</label>
      <input type="tel" name="whatsapp" placeholder="07X XXXXXXX" required>
    </div>
    
    <button type="submit" id="submitBtn">ඇතුලත් කරන්න</button>
  </form>

  <!-- Feedback සටහන පෙන්නුම් කරන ස්ථානය -->
  <div id="feedback"></div>
</div>

<script>
  // Google Apps Script Web App URL එක මෙතැනට paste කරන්න
  const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';
  
  const form = document.forms['studentForm'];
  const feedback = document.getElementById('feedback');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = 'යවමින් පවතී...';

    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => {
        feedback.className = 'success';
        feedback.innerText = 'ඔබගේ තොරතුරු සාර්ථකව ඇතුලත් කරන ලදී. ස්තූතියි!';
        feedback.style.display = 'block';
        form.reset();
        submitBtn.disabled = false;
        submitBtn.innerText = 'ඇතුලත් කරන්න';
      })
      .catch(error => {
        feedback.className = 'error';
        feedback.innerText = 'යම් දෝෂයක් සිදු විය! කරුණාකර නැවත උත්සාහ කරන්න.';
        feedback.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'ඇතුලත් කරන්න';
      });
  });
</script>

</body>
</html>
